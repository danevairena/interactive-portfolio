<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <title>Irena | Hello, Recruiter!</title>
</head>
<body>
    <header>
        <a href="#home" class="logo">Irena.</a>

        <div class="header-actions">
            <nav id="main-nav" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#learning">Learning Goals</a>
            </nav>
        
            <button type="button" id="theme-toggle" aria-label="Switch to dark mode">

                <!-- Moon -->
                <svg id="moon-icon" width="22" height="22"
                    viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M20.985 12.486A9 9 0 0 1 11.514 3.015
                            9 9 0 1 0 20.985 12.486"/>
                </svg>

                <!-- Sun -->
                <svg id="sun-icon" width="22" height="22"
                    viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true" hidden>
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
                            m11.3 11.3 1.42 1.42M2 12h2m16 0h2
                            M6.35 17.65l-1.42 1.42
                            M19.07 4.93l-1.42 1.42"/>
                </svg>
            </button>

            <button type="button" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="main-nav">

                <svg width="24" height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>    
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <span class="hero-label">SOFTWARE ENGINEER</span>

                <h1>Hello! I'm Irena.</h1>

                <p>
                    Turning curiosity into code,
                    one project at a time.
                </p>

                <a href="#about" class="primary-button">
                    GET TO KNOW ME
                </a>
            </div>

            <div class="hero-image">
                <img
                    src="assets/images/irenaaa.png"
                    alt="Cartoon illustration"
                    width="400"
                    height="600"
                    fetchpriority="high"
                >
            </div>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>Short introduction and motivation.</p>
        </section>

        <section id="skills">
            <h2>Skills</h2>
            <p>Technologies and skills.</p>
        </section>

        <section id="learning">
            <h2>Learning Goals</h2>
            <p>Interactive part.</p>
        </section>
    </main>

    <footer>

    </footer>
   <script src="js/app.js"></script> 
</body>
</html>
